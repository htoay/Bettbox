name: code_forge
description: "The code editor of Bettbox, derived from code_forge 10.14.0."
version: 10.14.0
homepage: https://github.com/heckmon/code_forge

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter  
  re_highlight: ^0.0.3
  flutter_rust_bridge: 2.13.0
  # 上游为 ^1.6.0，但 material_ui >=1.4.0 要求 Dart ^3.13.0，而鸿蒙工具链（flutter_ohos 3.44.9）
  # 只有 Dart 3.12.2；1.3.0 又被 pub.dev 撤回 → 钉到 1.2.0（与根 pubspec.yaml 保持一致）。
  material_ui: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
