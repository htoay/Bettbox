targets:
  $default:
    builders:
      source_gen:combining_builder:
        generate_for:
          - lib/models/**.dart
          - lib/providers/**.dart
        options:
          build_extensions:
            '^lib/models/{{}}.dart': 'lib/models/generated/{{}}.g.dart'
            '^lib/providers/{{}}.dart': 'lib/providers/generated/{{}}.g.dart'
      freezed:
        generate_for:
          - lib/models/**.dart
        options:
          build_extensions:
            '^lib/models/{{}}.dart': 'lib/models/generated/{{}}.freezed.dart'
      riverpod_generator:
        generate_for:
          - lib/providers/**.dart
      json_serializable:
        generate_for:
          - lib/models/**.dart
          - lib/providers/**.dart